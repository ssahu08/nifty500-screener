[project]
name = "n500-stock-screener"
version = "0.1.0"
description = "Personal NSE stock screener with custom strategies, dashboard and Telegram alerts."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
